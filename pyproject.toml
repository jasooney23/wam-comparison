[project]
name = "wam-comparison"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "torchrl>=0.15,<0.16",
    "tensordict>=0.15.2,<0.16",
    "tqdm>=4.70.1",
    "gymnasium[classic-control]",
    "tensorboard",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest",
    "ruff>=0.17.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
