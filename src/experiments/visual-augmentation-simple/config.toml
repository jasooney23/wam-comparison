[run]
output = "outputs/visual-augmentation-simple"
device = "cuda"
seeds = [0, 1, 2]
modalities = ["vector", "combined"]
cpu_threads = 1

[environment]
pole_mass = 0.1
cart_mass = [1.0, 1.01]
hinge_damping = [0.0, 0.0001]
max_steps = 500

[training]
# Each arm trains for the same number of episodes.
episodes = 1000
dataset = "outputs/visual-augmentation-simple/dataset.pt"
pretrain_transitions = 10000
pretrain_epochs = 100
batch_size = 256
world_lr = 0.0003
policy_lr = 0.0003
vector_weight = 1.0
image_weight = 1.0

[ppo]
rollout_steps = 2048
minibatch_size = 64
epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
value_weight = 0.5
entropy_weight = 0.0
max_grad_norm = 0.5

[evaluation]
interval = 100
episodes = 10
prediction_transitions = 256
# Every pair is outside the joint training parameter range.
settings = [[1.0, 0.0025], [0.25, 0.0025], [2.0, 0.0025], [1.0, 0.01], [0.25, 0.01], [2.0, 0.01]]
