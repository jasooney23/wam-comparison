[run]
output = "outputs/visual-augmentation-simple"
device = "cuda"
seeds = [0, 1, 2]
modalities = ["vector", "combined"]
cpu_threads = 1

[environment]
pole_mass = 0.1
cart_mass = [1.0, 1.01]
hinge_damping = [0.0, 0.0001]
max_steps = 500

[training]
mode = "joint"
episodes = 1000
pretrain_transitions = 20000
pretrain_epochs = 10
batch_size = 256
world_lr = 0.0003
policy_lr = 0.0003
vector_weight = 1.0
image_weight = 1.0
joint_weight = 1.0
world_updates = 1

[ppo]
rollout_steps = 2048
minibatch_size = 64
epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
value_weight = 0.5
entropy_weight = 0.0
max_grad_norm = 0.5

[evaluation]
interval = 100
episodes = 1
prediction_transitions = 1
# First setting is familiar. The remaining settings are held out.
settings = [[1.0, 0.0025], [0.25, 0.0025], [2.0, 0.0025], [1.0, 0.01], [0.25, 0.01], [2.0, 0.01]]

[accounting]
scope = "neural" # neural or broader_estimate
